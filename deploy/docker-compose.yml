# Nutribay Manufacturing ERP on one VPS:  docker compose up -d --build   (run from the repo root's deploy/ folder)
name: nutribay
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutribay_erp
      POSTGRES_USER: nutribay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutribay -d nutribay_erp"]
      interval: 5s
      retries: 20
    # no "ports:" -> the database is not reachable from the internet

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nutribay:${DB_PASSWORD}@db:5432/nutribay_erp
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      ALLOWED_ORIGINS: https://${DOMAIN}
      DEBUG: "false"
      # Outlook PO e-mail (Microsoft Graph, app-only Mail.Send) and authorised GST lookup — set in deploy/.env, optional
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SENDER: ${MS_SENDER:-}
      GST_API_URL: ${GST_API_URL:-}
      GST_API_KEY: ${GST_API_KEY:-}
      GST_API_KEY_HEADER: ${GST_API_KEY_HEADER:-}
      # Telegram Business Assistant bot token (from @BotFather) — set in deploy/.env, optional
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ":80"   # plain HTTP inside; the server's Traefik does HTTPS
    labels:
      - traefik.enable=true
      - traefik.http.services.nutribay.loadbalancer.server.port=80
      # live domain, Let's Encrypt certificate
      - traefik.http.routers.nutribay.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.nutribay.entrypoints=websecure
      - traefik.http.routers.nutribay.tls.certresolver=letsencrypt
      # login brute-force protection: max 10 attempts / minute per client IP
      - traefik.http.middlewares.nutribay-login-rl.ratelimit.average=10
      - traefik.http.middlewares.nutribay-login-rl.ratelimit.period=1m
      - traefik.http.middlewares.nutribay-login-rl.ratelimit.burst=10
      - traefik.http.routers.nutribay-login.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/v1/auth/login`)
      - traefik.http.routers.nutribay-login.entrypoints=websecure
      - traefik.http.routers.nutribay-login.tls.certresolver=letsencrypt
      - traefik.http.routers.nutribay-login.middlewares=nutribay-login-rl
      - traefik.http.routers.nutribay-login.service=nutribay
      - traefik.http.routers.nutribay-login.priority=100

volumes:
  pgdata:
  uploads:
